<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Rice</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <canvas id="canvas"></canvas>
    <div id="output"></div>
    <div id="upgs">
      <h3>upgrades</h3>
      <button id="autoclicker">autoclicker (200 pts)</button><br>
      <button id="multiplier">multiplier (300 pts)</button><br>
      <button id="abowl">add bowl (100 pts)</button><button id="aapbowl">Buy all</button>
      <button id="vaccum" onclick="if (score >= 10000){upgs.vaccum = true}">vacuum (10000 pts)</button><br>
      <div id="consumer">
        <h3>consumers</h3>
        Grains: <span id="total">0</span><br>
        <ul>
          <li><button id="sell">Sell last person</button></li>
          <li><button id="buy1">Add person - 500 points</button><br></li> x <span id="amtppl1">1</span>
          <li><button id="buy2">Add Mexican - 1.5 k points</button><br></li> x <span id="amtppl2">0</span>
          <li><button id="buy3">Add Japanese - 2.5 k points</button><br></li> x <span id="amtppl3">0</span>
          <li><button id="buy4">Add Asian - 5 k points</button><br></li> x <span id="amtppl4">0</span>
          <li><button id="buy5">Add Steven He - 100 k points</button><br></li> x <span id="amtppl5">0</span>
          <li><button id="buy6">Add Uncle Roger - 1 m points</button><br></li> x <span id="amtppl6">0</span>
          <li><button id="buy7">Add Great Uncle Roger - 100 m points</button><br></li> x <span id="amtppl7">0</span>
          <li><button id="buy8">Add Beijing Corn - 10 b points</button><br></li> x <span id="amtppl8">0</span>
          <li><button id="buy9">Add me - 100 b points</button><br></li> x <span id="amtppl9">0</span>
          <li><button id="buy10">Add oliver - 1 t points</button><br></li> x <span id="amtppl10">0</span>
          <li><button id="buy11">Add Inari - 5 qd points</button><br></li> x <span id="amtppl11">0</span>
          <li><button id="buy12">Add the magic of science - 1 sx points</button><br></li> x <span id="amtppl12">0</span>
          <li><button id="buy13">good job - 10 sp points</button><br></li> x <span id="amtppl13">0</span>
          <li><button id="buy14">good job 2 - 100 oc points</button><br></li> x <span id="amtppl14">0</span>
          <li><button id="buy15">good job 3 - 1 NoD points</button><br></li> x <span id="amtppl15">0</span>
        </ul>
      </div>
      <button id="clear" onclick="clearSave()" style="background-color: red; color: white;">Clear Save</button>
      <div id="pinpad">
        <button id="pp1">1</button>
        <button id="pp2">2</button>
        <button id="pp3">3</button>
        <button id="pp4">4</button>
        <button id="pp5">5</button>
        <button id="pp6">6</button>
        <button id="pp7">7</button>
        <button id="pp8">8</button>
        <button id="pp9">9</button>
        <button id="ppclr">&lt;</button>
        <button id="pp0">0</button>
        <button id="ppbck">↵</button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
